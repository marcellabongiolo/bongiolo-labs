name: Platform Service CI

on:
  push:
    paths:
      - "cloud-platform/platform-service/**"
      - ".github/workflows/platform-service.yml"
  pull_request:
    paths:
      - "cloud-platform/platform-service/**"
      - ".github/workflows/platform-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-platform/platform-service
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t bongiolo-platform-service .
